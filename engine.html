<!doctype html>
<!--
  Nucleus engine shell.
  Functionality: file-backed browser/search tab container loaded by main.js.
  Dependencies: engine.js renders search result HTML targeting this page.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nucleus Engine</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1117;
      --surface: #171a21;
      --border: #262b36;
      --text: #e7e9ee;
      --text-dim: #9aa1b1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background:
        radial-gradient(circle at 18% 8%, rgba(117, 103, 216, 0.16), transparent 30%),
        radial-gradient(circle at 78% 12%, rgba(90, 169, 200, 0.1), transparent 32%),
        radial-gradient(circle at 52% 106%, rgba(199, 154, 84, 0.08), transparent 34%),
        linear-gradient(180deg, #101219 0%, #0d0f15 100%);
      background-attachment: fixed;
      background-position: 0% 0%, 100% 0%, 50% 100%, 50% 50%;
      background-size: 140% 140%, 150% 150%, 135% 135%, 100% 100%;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      padding: 0 34px 34px;
      animation: engineAmbientDrift 100s ease-in-out infinite alternate;
    }

    @keyframes engineAmbientDrift {
      0% {
        background-position: 0% 0%, 100% 0%, 50% 100%, 50% 50%;
      }

      50% {
        background-position: 7% 5%, 93% 7%, 48% 94%, 50% 50%;
      }

      100% {
        background-position: 13% 9%, 86% 12%, 54% 88%, 50% 50%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body {
        animation: none;
      }
    }

    main {
      align-items: center;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    h1 {
      font-size: 42px;
      font-weight: 650;
      margin: 0 0 24px;
    }

    .engine-search {
      align-items: center;
      display: flex;
      flex-direction: column;
      margin-top: 30vh;
      transform: translateY(-50%);
      width: min(760px, 100%);
    }

    #engine-search-form {
      width: 100%;
    }

    #engine-search-input {
      background: #151821;
      border: 1px solid #2b3140;
      border-radius: 999px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
      color: var(--text);
      font: inherit;
      font-size: 18px;
      height: 58px;
      outline: none;
      padding: 0 24px;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      width: 100%;
    }

    #engine-search-input:focus {
      background: #181c26;
      border-color: #766dff;
      box-shadow: 0 20px 52px rgba(0, 0, 0, 0.34), 0 0 0 3px rgba(118, 109, 255, 0.18);
    }

    #engine-search-input::placeholder {
      color: var(--text-dim);
    }

    .app-grid {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fill, 104px);
      justify-content: center;
      margin-top: -6vh;
      width: min(760px, 100%);
    }

    .app-link {
      align-items: center;
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 108px;
      padding: 0 6px;
      text-align: center;
      text-decoration: none;
      transition: transform 0.15s;
    }

    .app-link:hover,
    .app-link:focus-visible {
      outline: none;
      transform: translateY(-2px);
    }

    .app-icon {
      display: block;
      height: 96px;
      margin-bottom: 2px;
      overflow: hidden;
      width: 96px;
    }

    .app-icon img {
      display: block;
      height: 100%;
      object-fit: cover;
      width: 100%;
    }

    a[href="nucleus://app/mail"] .app-icon img {
      height: 82px;
      object-fit: contain;
      width: 82px;
    }

    .app-name {
      font-size: 13px;
      font-weight: 600;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main>
    <section class="engine-search" aria-label="Search">
      <h1>Nucleus Engine</h1>
      <form id="engine-search-form">
        <input id="engine-search-input" type="text" autocomplete="off" autofocus placeholder="Search the web or enter a URL">
      </form>
    </section>

    <section class="app-grid" aria-label="Apps">
      <a class="app-link" href="nucleus://app/canvas" aria-label="Open Canvas">
        <span class="app-icon" aria-hidden="true">
          <img src="app/canvas/assets/canvas_icon.png" alt="">
        </span>
        <span class="app-name">Canvas</span>
      </a>
      <a class="app-link" href="nucleus://app/synapse" aria-label="Open Synapse">
        <span class="app-icon" aria-hidden="true">
          <img src="app/synapse/assets/synapse_icon.png" alt="">
        </span>
        <span class="app-name">Synapse</span>
      </a>
      <a class="app-link" href="nucleus://app/mail" aria-label="Open Mail">
        <span class="app-icon" aria-hidden="true">
          <img src="app/mail/assets/mail_icon.svg" alt="">
        </span>
        <span class="app-name">Mail</span>
      </a>
    </section>
  </main>

  <script>
    function normalizeSearchUrl(value) {
      const text = String(value || "").trim();
      if (!text) return "";
      if (/^[a-zA-Z][a-zA-Z\d+\-.]*:/.test(text)) return text;
      if (text.includes(".") && !text.includes(" ")) return "https://" + text;
      return "nucleus://search?q=" + encodeURIComponent(text);
    }

    document.getElementById("engine-search-form").addEventListener("submit", event => {
      event.preventDefault();
      const url = normalizeSearchUrl(document.getElementById("engine-search-input").value);
      if (url) window.location.href = url;
    });
  </script>
</body>
</html>
