<!DOCTYPE html>
<!--
  Nucleus app shell.
  Functionality: defines the static Electron renderer layout and loads renderer,
  Canvas, and task optimizer scripts in dependency order.
  Dependencies: preload.js exposes window.nucleus; styles.css owns layout.
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nucleus</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app/synapse/synapse.css">
  <link rel="stylesheet" href="app/mail/mail.css">

</head>

<body>
  <div class="app">

    <header class="app-header">
      <div class="brand">
        <div class="brand-mark"></div>
        <span>nucleus</span>
      </div>

      <nav class="primary-tabs" id="primary-tabs">
        <button type="button" class="active" data-section="home">Home</button>
        <button type="button" data-section="tasks">Tasks</button>
        <button type="button" data-section="calendar">Calendar</button>
        <span class="primary-tabs-separator" aria-hidden="true"></span>
      </nav>
    </header>

    <div class="app-body">

      <!-- LEFT SIDEBAR -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-label">Workspaces</div>
          <button type="button" class="workspace-sidebar-toggle" id="workspace-sidebar-toggle" aria-label="Collapse workspace sidecar" aria-expanded="true">&lt;</button>
        </div>
        <nav class="workspace-tabs" id="workspace-tabs"></nav>
        <button type="button" class="new-workspace-button" id="new-workspace-button">
          <span>+</span>
          <span>New workspace</span>
        </button>
        <form class="new-workspace-form is-hidden" id="new-workspace-form">
          <input type="text" id="new-workspace-input" placeholder="Workspace name">
          <div class="new-workspace-actions">
            <button type="submit">Add</button>
            <button type="button" id="cancel-new-workspace">Cancel</button>
          </div>
        </form>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="content">
        <div class="workspace-page-tabs" id="workspace-page-tabs">
          <!-- tabs get rendered here by renderer/app.js -->
        </div>
        <div class="browser-toolbar is-hidden" id="browser-toolbar"></div>
        <div class="canvas-toolbar is-hidden" id="canvas-toolbar"></div>
        <div class="canvas-blank-slate" id="canvas-blank-slate" aria-hidden="true"></div>
        <div class="tab-wipe" id="tab-wipe" aria-hidden="true"></div>
        <div id="view"></div>
      </main>

      <!-- RIGHT AI PANEL -->
      <aside class="ai-panel" id="ai-panel">
        <div class="ai-panel-resize-handle" id="ai-panel-resize-handle" role="separator" aria-orientation="vertical" aria-label="Resize LUMI panel"></div>

        <div class="ai-panel-header">
          <span>LUMI Assistant</span>
          <button type="button" class="ai-panel-icon-button" id="ai-panel-minimize" aria-label="Minimize assistant">-</button>
        </div>

        <div class="ai-messages" id="ai-messages">
          <div class="ai-hero-card">
            <div class="ai-hero-mark" aria-hidden="true"></div>
            <h2>Hi, I'm LUMI.</h2>
            <p>I can help you add tasks, create workspaces, or organize your schedule.</p>
          </div>
          <div class="ai-quick-actions" aria-label="Assistant shortcuts">
            <button type="button">Add task</button>
            <button type="button">Create workspace</button>
            <button type="button">Plan my day</button>
          </div>
        </div>

        <div class="ai-input-section">
          <div class="ai-attachments" id="ai-attachments" aria-live="polite"></div>
          <div class="ai-input-wrapper">
            <button type="button" class="ai-attach-button" id="ai-attach-button" aria-label="Attach file">+</button>
            <input type="file" id="ai-file-input" multiple hidden>
            <input
              type="text"
              id="ai-input"
              placeholder="Ask LUMI anything..."
            >

            <button type="button" class="ai-send-button" onclick="sendMessage()">
              Send
            </button>
          </div>
        </div>

      </aside>
      <button type="button" class="ai-panel-restore-button" id="ai-panel-restore" aria-label="Restore assistant">LUMI</button>

    </div>
  </div>

  <script src="app/canvas/course.js"></script>
  <script src="app/canvas/dashboard.js"></script>
  <script src="app/synapse/chat.js"></script>
  <script src="app/synapse/synapse.js"></script>
  <script src="app/mail/mail.js"></script>
  <script src="taskoptimizer.js"></script>
  <script src="renderer/workspace-page-tabs.js"></script>
  <script src="renderer/render.js"></script>
  <script src="app/synapse/synapse-tabs.js"></script>
  <script src="app/mail/mail-tabs.js"></script>
  <script src="renderer/app.js"></script>
</body>

</html>
