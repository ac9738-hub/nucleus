<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nucleus</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    /* RIGHT AI PANEL */
    .ai-panel {
      width: 340px;
      background: #161616;
      border-left: 1px solid #2c2c2c;
      display: flex;
      flex-direction: column;
    }

    .ai-panel-header {
      padding: 18px;
      border-bottom: 1px solid #2c2c2c;
      font-size: 15px;
      font-weight: bold;
      color: white;
    }

    .ai-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ai-message {
      background: #252525;
      padding: 12px;
      border-radius: 10px;
      color: white;
      line-height: 1.4;
    }

    .ai-input-section {
      padding: 16px;
      border-top: 1px solid #2c2c2c;
      display: flex;
      gap: 10px;
    }

    .ai-input-section input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #2b2b2b;
      color: white;
      outline: none;
    }

    .ai-input-section button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .ai-input-section button:hover {
      background: #4338ca;
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="app-header">
      <div class="brand">
        <div class="brand-mark"></div>
        <span>nucleus</span>
      </div>

      <nav class="primary-tabs" id="primary-tabs">
        <button type="button" class="active" data-section="projects">Projects</button>
        <button type="button" data-section="tasks">Tasks</button>
        <button type="button" data-section="calendar">Calendar</button>
        <span class="primary-tabs-separator" aria-hidden="true"></span>
      </nav>
    </header>

    <div class="app-body">

      <!-- LEFT SIDEBAR -->
      <aside class="sidebar">
        <div class="sidebar-label">Workspaces</div>
        <nav class="workspace-tabs" id="workspace-tabs"></nav>
        <button type="button" class="new-workspace-button" id="new-workspace-button">
          <span>+</span>
          <span>New workspace</span>
        </button>
        <form class="new-workspace-form is-hidden" id="new-workspace-form">
          <input type="text" id="new-workspace-input" placeholder="Workspace name">
          <div class="new-workspace-actions">
            <button type="submit">Add</button>
            <button type="button" id="cancel-new-workspace">Cancel</button>
          </div>
        </form>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="content">
        <div class="workspace-page-tabs" id="workspace-page-tabs">
          <!-- tabs get rendered here by renderer.js -->
        </div>
        <div class="browser-toolbar is-hidden" id="browser-toolbar"></div>
        <div class="canvas-toolbar is-hidden" id="canvas-toolbar"></div>
        <div class="tab-wipe" id="tab-wipe" aria-hidden="true"></div>
        <div id="view"></div>
      </main>

      <!-- RIGHT AI PANEL -->
      <aside class="ai-panel">

        <div class="ai-panel-header">
           LUMI Assistant
        </div>

        <div class="ai-messages" id="ai-messages">
          <div class="ai-message">
            Ask LUMI to add tasks, create workspaces, or organize your schedule.
          </div>
        </div>

        <div class="ai-input-section">
          <input
            type="text"
            id="ai-input"
            placeholder="Ask LUMI anything..."
          >

          <button onclick="sendMessage()">
            Send
          </button>
        </div>

      </aside>

    </div>
  </div>

  <script src="course.js"></script>
  <script src="renderer.js"></script>
</body>

</html>
